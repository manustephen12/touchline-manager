:root[data-theme="dark"]{--bg:#0d1a12;--panel:#15271c;--ink:#e6efe6;--mute:#8fa597;--line:#27402f;--acc:#f0b429;--accink:#1a1300;--good:#4cc27f;--bad:#ef7a6a;--pitch:#18452b}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:500 15px/1.45 Barlow,system-ui,sans-serif}
h1,h2,h3,.big{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;margin:0;letter-spacing:.01em}
h2{font-size:24px;margin-bottom:10px}h3{font-size:18px;margin:14px 0 6px}
#wrap{max-width:640px;margin:0 auto;padding:14px 14px 90px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.top h1{font-size:22px}.money{font-weight:600;color:var(--acc)}

.row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}.row svg.av{width:38px;height:38px;flex:none}
.row .g{flex:1;min-width:0}.row .s{font-size:12.5px;color:var(--mute)}
.pos{display:inline-block;min-width:34px;text-align:center;font-size:12px;font-weight:700;border-radius:5px;padding:1px 5px;color:#fff}
.GK{background:#b9770e}.DF{background:#2874a6}.MF{background:#1e8449}.FW{background:#b03a2e}
.ovr{font-family:"Barlow Condensed",sans-serif;font-size:22px;font-weight:700;width:34px;text-align:right}

.feed .g{color:#ffd35c;font-weight:700}

.pick{display:grid;grid-template-columns:1fr 1fr;gap:10px}.pick button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px}
.pick svg{width:52px;height:60px}.seg{display:flex;gap:8px;flex-wrap:wrap}
.res{font-size:14px;color:var(--mute)}.win{color:var(--good)}.lose{color:var(--bad)}
.tabs button{font-size:13px;padding:8px 2px}.shelf{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;padding:8px 6px 4px;border-bottom:6px solid var(--line);min-height:56px}.shelf figure{margin:0;text-align:center;font-size:11px;color:var(--mute)}.chip{display:inline-block;width:24px;height:24px;line-height:24px;text-align:center;border-radius:6px;color:#fff;font-weight:700;margin-right:4px;font-size:13px}.chip.W{background:var(--good)}.chip.D{background:#8a8f94}.chip.L{background:var(--bad)}
</style>

<script>
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1)),pick=a=>a[Math.floor(Math.random()*a.length)],cl=(x,a,b)=>Math.max(a,Math.min(b,x));
const FN=["Luca","Marco","Tomas","Jonas","Ravi","Diego","Kofi","Mateo","Ivan","Sami","Leo","Niko","Omar","Felix","Hugo","Yusuf","Andre","Pablo","Erik","Tariq"];
const LN=["Silva","Okoye","Brandt","Moreau","Petrov","Costa","Lindqvist","Haddad","Novak","Ruiz","Adeyemi","Fischer","Rossi","Tanaka","Varga","Mensah","Duarte","Kovac","Santos","Berg"];
const CLUBS=[["Harbor Rovers","#1f6fb2","HR"],["Red Mill United","#c0392b","RM"],["Northgate City","#7d3c98","NC"],["Ironbridge Town","#556270","IT"],["Sunvale Athletic","#d49a00","SA"],["Greenfield FC","#1e8449","GF"],["Stoneport Wanderers","#d35400","SW"],["Kingsway Albion","#139a9a","KA"],
["Eastvale Rovers","#b7410e","ER"],["Lakeside Town","#2e86c1","LT"],["Oakham United","#6e4b2a","OU"],["Fenwick Athletic","#c2185b","FA"],["Redcliffe City","#a93226","RC"],["Marlow Wanderers","#117a65","MW"],["Thornbury FC","#34495e","TF"],["Ashford Albion","#af7ac5","AA"],
["Brookside FC","#2874a6","BF"],["Cliffhaven Town","#7f8c8d","CT"],["Dunmore Rovers","#cb4335","DR"],["Elmwood United","#229954","EU"],["Foxhill Athletic","#ca6f1e","FH"],["Glenrock City","#5b2c6f","GC"],["Hartley Wanderers","#1b4f72","HW"],["Ironvale Albion","#b9770e","IA"]];
{const PRE=["Alder","Bramley","Calder","Dunmere","Eastgate","Falcon","Grayson","Hollin","Ivybridge","Jasper","Kestrel","Linden","Maple","Nettle","Orchard","Pinewood","Quarry","Rowan","Silverton","Tamarind","Underhill","Vernon","Willow","Yarrow","Zephyr","Ashdown","Beacon","Copperfield","Dovecote","Elderfield","Fernhill","Goldcrest","Heron","Inkwell","Juniper","Kelston","Lanterne","Mossgate","Northfield","Oldbury"],SUF=["FC","Town","United","City","Rovers","Athletic","Albion","Wanderers"],PAL=["#1f6fb2","#c0392b","#1e8449","#d49a00","#7d3c98","#d35400","#139a9a","#2c3e50","#a93226","#117a65","#af7ac5","#6e4b2a"];
 PRE.forEach((p,i)=>CLUBS.push([p+" "+SUF[i%8],PAL[(i*5)%12],p.slice(0,2).toUpperCase()]))}
const DIVN=["Global League","Continental League","National Premier","National First","Regional Premier","Regional First","District League","Streets League"],LV=[0,1,2,3,4,5,6,7],LB=[78,74,70,66,62,58,54,50],BUD=[60000,40000,28000,20000,14000,9000,5000,3000],DM=[3,2.4,1.9,1.5,1.1,.8,.6,.45],MENTS=["Leader","Professional","Hothead","Big-game player","Lazy","Calm","Fragile","Ambitious"],FORMS={"442":{DF:4,MF:4,FW:2},"433":{DF:4,MF:3,FW:3},"352":{DF:3,MF:5,FW:2}},MENT={atk:"Attack",bal:"Balanced",def:"Defend"};
const CAL="LLCLELLCLELLCLELLCLLCLEC",CLR=["Round of 16","Quarter-finals","Semi-finals","Final"],CUPR=["Round of 64","Round of 32","Round of 16","Quarter-finals","Semi-finals","Final"];
const TRAIN={rest:"Rest & recovery",sho:"Shooting",pas:"Passing",def:"Defending",pac:"Pace"};
let S=null,tab="home",live=null,timer=null,nid=1,tview=null,sub="league",ssub="players";
const SK=["#f1c9a5","#d9a273","#a96d45","#7a4a2c","#4e2e1b"],HR=["#1c1410","#4a3020","#8a5a2b","#c9a050","#2b2b2b"];
const avail=p=>!p.inj&&!p.susp;
function ovr(p){const{pac,pas,sho,def}=p;return Math.round(p.pos==="GK"?def:p.pos==="DF"?def*.6+pac*.2+pas*.2:p.pos==="MF"?pas*.5+def*.2+sho*.15+pac*.15:sho*.55+pac*.3+pas*.15)}
let KO=false;const eff=p=>ovr(p)*(.85+.15*p.fit/100)+({Leader:2,Hothead:1,Lazy:-1}[p.mn]||0)+(KO&&p.mn==="Big-game player"?3:0);
const wpick=(L,f)=>{if(!L.length)return;const w=L.map(f);let r=Math.random()*w.reduce((a,b)=>a+b,0);for(let i=0;i<L.length;i++){r-=w[i];if(r<=0)return L[i]}return L[0]};
const z=()=>({ap:0,g:0,a:0,cs:0,mom:0});
function mk(pos,b){const hi=()=>cl(b+R(-3,6),30,92),lo=()=>cl(b-R(8,20),20,80);
 const st={GK:{def:hi(),pac:lo(),pas:lo(),sho:20},DF:{def:hi(),pac:lo()+8,pas:lo()+6,sho:lo()},MF:{pas:hi(),def:lo()+6,pac:lo()+8,sho:lo()+6},FW:{sho:hi(),pac:hi()-4,pas:lo()+8,def:25}}[pos];
 const p={id:nid++,name:pick(FN)+" "+pick(LN),age:R(18,34),pos,fit:100,st:z(),ct:z(),mn:pick(MENTS),inj:0,susp:0,yc:0,...st};fixP3(p);return p}
function mkTeam(i){const d=Math.floor(i/8),b=LB[d]+R(-3,3),sq=[];[["GK",2],["DF",5],["MF",5],["FW",4]].forEach(([p,n])=>{for(let k=0;k<n;k++)sq.push(mk(p,b))});
 return{id:i,shape:SH[i],...initClub(d),name:CLUBS[i][0],col:CLUBS[i][1],ini:CLUBS[i][2],div:d,players:sq,budget:BUD[d],tac:{form:"442",ment:"bal"},train:"rest"}}
const value=p=>Math.max(300,Math.round((ovr(p)-45)**2*20*(p.age>30?.6:1)/50)*50);
function sched(ids){ids=ids.slice();const rs=[];for(let r=0;r<7;r++){const m=[];for(let i=0;i<4;i++){const a=ids[i],b=ids[7-i];m.push(r%2?[b,a]:[a,b])}rs.push(m);ids.splice(1,0,ids.pop())}
 return rs.concat(rs.map(r=>r.map(([h,a])=>[a,h])))}
function schedAll(){const s=LV.map(d=>sched(S.teams.filter(t=>t.div===d).map(t=>t.id)));return[...Array(14).keys()].map(r=>[].concat(...s.map(x=>x[r])))}
const freshTable=()=>Object.fromEntries([...Array(64).keys()].map(i=>[i,{p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0}]));
const newCup=()=>({r:0,alive:[...Array(64).keys()],log:[],champ:null,runner:null,next:[]});
function market(lv){lv=lv??(S&&S.teams?S.teams[S.user].div:7);const m=[];["GK","DF","DF","MF","MF","FW","FW","FW"].forEach(p=>{const x=mk(p,LB[lv]+R(-4,6));x.age=R(19,32);m.push(x)});return m}
function newGame(o){const u=63;S={teams:CLUBS.map((_,i)=>mkTeam(i)),user:u,round:0,step:0,table:freshTable(),cup:newCup(),mk:market(7),last:null,season:1,msg:"",inj:[],v:5,club:mkClub(),mgr:{name:o.mgr,pic:o.pic}};
 Object.assign(S.teams[u],{name:o.club,col:o.col,ini:o.ini,shape:o.shape});S.fx=schedAll();S.cl=newCL(seedCL());S.cal=CAL;tview=null;sub="league";save()}
const SHL=["shield","circle","oval","hexagon","diamond","star","triangle","pentagon","square","arch"];
const SH=["triangle","oval","hexagon","arch","star","circle","diamond","pentagon","square","circle","shield","pentagon","triangle","diamond","star","square","circle","triangle","hexagon","shield","pentagon","diamond","oval","arch"];
for(let i=24;i<64;i++)SH.push(SHL[(i*3)%10]);
const SB=[60000,45000,32000,22000,15000,10000,6500,3500],FB=[90000,65000,45000,30000,20000,12000,7000,3500];
const initClub=d=>({stad:Math.round(SB[d]*R(85,115)/100/500)*500,fans:Math.round(FB[d]*R(85,115)/100/100)*100,fac:1+(d<2?R(1,2):d<5?R(0,1):0),att:0});
const mkClub=()=>({form:[],trophies:{league:[0,0,0,0,0,0,0,0],cup:0,runner:0,promo:0,cl:0,clRunner:0},awards:[],hist:[],youth:[],retired:[],acad:1});
const wageOf=p=>Math.max(30,Math.round(value(p)/60/5)*5),potOf=p=>{const o=ovr(p);return cl(o+(p.age<22?R(5,15):p.age<26?R(0,7):0),o,95)};
function fixP3(p){p.contract=R(2,4);p.wage=wageOf(p);p.pot=potOf(p)}
const newCL=q=>({r:0,alive:q.slice(),q:q.slice(),log:[],champ:null,runner:null,next:[]});
const teamOvr=t=>lineup(t).reduce((s,p)=>s+ovr(p),0);
const seedCL=()=>LV.flatMap(d=>S.teams.filter(t=>t.div===d).sort((a,b)=>teamOvr(b)-teamOvr(a)).slice(0,2).map(t=>t.id));
function fillSquad(t,full){const need={GK:2,DF:full?5:4,MF:full?5:4,FW:full?4:3},add=[],b=LB[t.div]-4,mkp=pos=>{const p=mk(pos,b+R(-6,3));p.age=full?R(17,22):R(20,29);p.contract=R(2,3);p.pot=potOf(p);p.wage=wageOf(p);t.players.push(p);add.push(p)};
 for(const pos in need)while(t.players.filter(p=>p.pos===pos).length<need[pos])mkp(pos);
 while(t.players.length<(full?16:14))mkp(pick(["DF","MF","FW"]));return add}
let saveOk=true;
function save(){try{S.v=5;S.saved=Date.now();localStorage.setItem("tm1",JSON.stringify(S));saveOk=true}catch(e){saveOk=false}}
function fixNid(){nid=Math.max(...S.teams.flatMap(t=>t.players.map(p=>p.id)),...S.mk.map(p=>p.id))+1}
function load(){try{const s=localStorage.getItem("tm1");if(s){S=JSON.parse(s);if(S.v!==5||S.teams.length!==64||!S.mgr)S=null;else fixNid()}}catch(e){S=null}}

function lineup(t){const f=FORMS[t.tac.form],o=[],ok=t.players.filter(avail);
 for(const pos of["GK","DF","MF","FW"]){const n=pos==="GK"?1:f[pos];o.push(...ok.filter(p=>p.pos===pos).sort((a,b)=>eff(b)-eff(a)).slice(0,n))}
 if(o.length<11)o.push(...ok.filter(p=>!o.includes(p)).sort((a,b)=>eff(b)-eff(a)).slice(0,11-o.length));return o}
function strength(t,home){const L=lineup(t),av=pos=>{const x=L.filter(p=>p.pos===pos);return x.length?x.reduce((s,p)=>s+eff(p),0)/x.length:40},k=t.tac.ment==="atk"?4:t.tac.ment==="def"?-4:0,h=home?2:0;
 return{A:(av("FW")*2+av("MF"))/3+k+h,D:(av("DF")*2+av("GK"))/3-k+h,M:av("MF")+h,gk:av("GK"),L}}
function sim(h,a){const H=strength(h,1),A=strength(a,0),ev=[],fresh=[],inc=[];let gh=0,ga=0;
 const E=(m,t,k)=>ev.push({m,t,k,sh:gh,sa:ga});
 E(0,`Kick-off! ${h.name} host ${a.name}.`,"i");
 const L0={h:H.L.slice(),a:A.L.slice()},mg={},ma={};[...H.L,...A.L].forEach(p=>p.st.ap++);
 for(let m=1;m<=90;m++){
  if(m===46)E(45,`Half-time: ${h.name} ${gh}–${ga} ${a.name}.`,"i");
  const x=Math.random();
  if(x<.0092){const typ=x<.0025?0:1,hs=Math.random()<.5,T=hs?h:a,X=hs?H:A,p=wpick(X.L.filter(q=>q.pos!=="GK"&&!fresh.includes(q.id)),q=>typ===0?(q.mn==="Fragile"?2:1):(q.mn==="Hothead"?3:q.mn==="Calm"?.3:1)),n=p&&p.name.split(" ")[1];
   if(p){if(x<.0025){p.inj=R(1,6);fresh.push(p.id);X.L=X.L.filter(q=>q!==p);X.A-=1.5;X.D-=1.5;E(m,`${n} (${T.name}) is injured and limps off.`,"n");inc.push({id:T.id,txt:`${p.name} injured for ${p.inj} matches.`})}
    else if(x<.0037){p.susp=R(1,3);fresh.push(p.id);X.L=X.L.filter(q=>q!==p);X.A-=5;X.D-=5;X.M-=4;E(m,`RED CARD! ${n} (${T.name}) is sent off. ${T.name} are down to ten.`,"r");inc.push({id:T.id,txt:`${p.name} sent off, banned for ${p.susp} matches.`})}
    else{p.yc++;if(p.yc>=3){p.yc=0;p.susp=1;fresh.push(p.id);E(m,`Yellow card for ${n} (${T.name}). A third booking means a one-match ban.`,"n");inc.push({id:T.id,txt:`${p.name} banned for 1 match (3 yellow cards).`})}else E(m,`Yellow card for ${n} (${T.name}).`,"n")}}
   continue}
  if(Math.random()>.17)continue;
  const ph=Math.pow(H.M,3)/(Math.pow(H.M,3)+Math.pow(A.M,3)),hs=Math.random()<ph,at=hs?H:A,df=hs?A:H,tm=hs?h:a,op=hs?a:h;
  const mf=at.L.filter(p=>p.pos==="MF"),fw=at.L.filter(p=>p.pos==="FW"),wp=at.L.filter(p=>p.pos!=="GK").map(p=>({p,w:Math.pow(p.sho,2)*(p.pos==="FW"?3:p.pos==="MF"?1:.25)}));
  let r=Math.random()*wp.reduce((s,x)=>s+x.w,0),sc=wp[0].p;for(const y of wp){r-=y.w;if(r<=0){sc=y.p;break}}
  const pool=at.L.filter(p=>p!==sc&&p.pos!=="GK"),as=pick(pool.length?pool:at.L),sn=sc.name.split(" ")[1],an=as.name.split(" ")[1];
  if(Math.random()>cl(.4+(at.A-df.D)/120,.15,.8)){if(Math.random()<.35)E(m,pick([`${tm.name} build up well but ${op.name} close the door.`,`${an} loses the ball in a dangerous area.`,`A promising move from ${tm.name} ends with an offside flag.`]),"n");continue}
  if(Math.random()<cl(.3+(at.A-df.gk)/150,.1,.6)){hs?gh++:ga++;sc.st.g++;mg[sc.id]=(mg[sc.id]||0)+1;if(as!==sc){as.st.a++;ma[as.id]=(ma[as.id]||0)+1}
   E(m,`GOAL! ${sn} ${pick(["slots it home","fires into the corner","heads in from close range","finishes coolly"])} after a pass from ${an}. ${tm.name} score!`,"g")}
  else{const gk=(df.L.find(p=>p.pos==="GK")||df.L[0]).name.split(" ")[1];E(m,pick([`${sn} shoots… great save by ${gk}!`,`${sn} blasts it over the bar.`,`${sn} hits the post! So close for ${tm.name}.`,`${gk} tips ${sn}’s effort round the post.`]),"n")}}
 const cs=(L,g)=>{if(g===0)L.filter(p=>p.pos==="GK"||p.pos==="DF").forEach(p=>p.st.cs++)};cs(L0.h,ga);cs(L0.a,gh);
 let best=null,bs=-1;[...L0.h.map(p=>[p,gh>ga,ga]),...L0.a.map(p=>[p,ga>gh,gh])].forEach(([p,w,conc])=>{const v=(mg[p.id]||0)*3+(ma[p.id]||0)*2+(conc===0?(p.pos==="GK"?3:p.pos==="DF"?1.5:0):0)+(w?1:0)+Math.random()*1.5;if(v>bs){bs=v;best=p}});
 best.st.mom++;E(90,`Man of the match: ${best.name}.`,"i");
 E(90,`Full-time: ${h.name} ${gh}–${ga} ${a.name}.`,"i");return{h:h.id,a:a.id,gh,ga,ev,fresh,inc}}

function apply(h,a,gh,ga){const T=S.table,H=T[h],A=T[a];H.p++;A.p++;H.gf+=gh;H.ga+=ga;A.gf+=ga;A.ga+=gh;
 if(gh>ga){H.w++;A.l++;H.pts+=3}else if(gh<ga){A.w++;H.l++;A.pts+=3}else{H.d++;A.d++;H.pts++;A.pts++}}
function koDraw(K){const ids=K.alive.slice().sort(()=>Math.random()-.5),p=[];for(let i=0;i<ids.length;i+=2)p.push([ids[i],ids[i+1]]);K.next=[];return p}

function vContracts(t){const ps=t.players.slice().sort((a,b)=>a.contract-b.contract||ovr(b)-ovr(a)),wb=t.players.reduce((s,p)=>s+p.wage,0);
 return`<div class="card"><div class="res">Wage bill: <b>${money(wb)}</b> per season, paid at season end. Players whose contracts run out leave the club. Renewing costs one season of the player’s wage and adds 3 years.</div></div><div class="card">${ps.map(p=>prow(p,t,`<div style="text-align:center"><div class="res">${p.contract} yr · £${p.wage}k</div><button ${t.budget<p.wage||p.contract>=4?"disabled":""} onclick="renew(${p.id})">Renew</button></div>`)).join("")}</div>`}
function vClub(){const t=S.teams[S.user],C=S.club,tr=C.trophies,L=t.fac,std=t.name.split(" ")[0]+" Park",fill=t.att?Math.round(t.att/t.stad*100):0,wb=t.players.reduce((s,p)=>s+p.wage,0);
 const fg=(c,n,l)=>Array.from({length:n},()=>`<figure>${trophy(c)}<div>${l}</div></figure>`).join(""),sh=(lb,it)=>`<div class="res" style="margin-top:10px">${lb}</div><div class="shelf">${it||'<span class="res">Empty</span>'}</div>`;
 const pts=C.form.reduce((s,x)=>s+(x==="W"?3:x==="D"?1:0),0),mood=!C.form.length?"Waiting for the first match":pts>=11?"Delighted":pts>=8?"Happy":pts>=5?"Content":pts>=3?"Restless":"Angry";
 return`<h2>Club</h2><div class="card pitchcard"><div class="vs">${badge(t,72)}</div><div style="text-align:center"><div class="big" style="font-size:26px">${t.name}</div><div style="opacity:.85">${DIVN[t.div]} · ${std}</div><div style="margin-top:8px;display:flex;justify-content:center;gap:8px;align-items:center">${mgrFace(S.mgr.pic,36)}<span>Manager ${S.mgr.name}</span></div></div></div>
 <div class="card"><h3 style="margin-top:0">Trophy cabinet</h3>${sh("League titles",LV.map(d=>fg(TC[d<3?0:d<6?1:2],tr.league[d],DIVN[d])).join(""))}${sh("Cup",fg(TC[0],tr.cup,"Winners")+fg(TC[1],tr.runner,"Runners-up"))}${sh("Champions League",fg(TC[0],tr.cl||0,"Winners")+fg(TC[1],tr.clRunner||0,"Runners-up"))}${sh("Promotions",Array.from({length:tr.promo},()=>`<figure><div style="font-size:26px;color:var(--good)">▲</div><div>Promoted</div></figure>`).join(""))}
 ${C.awards.length?`<div class="res" style="margin-top:10px">Player awards</div>${C.awards.map(a=>`<div>${a.k}: <b>${a.name}</b> (season ${a.s}, ${a.v})</div>`).join("")}`:`<p class="res">Win a league, a cup or a promotion to fill the cabinet.</p>`}</div>
 <div class="card"><h3 style="margin-top:0">Finances</h3><div class="big" style="font-size:28px">${money(t.budget)}</div><div class="res">Wage bill ${money(wb)} per season, paid at season end. Income: gate receipts, win bonuses and end-of-season prizes.</div></div>
 <div class="card"><h3 style="margin-top:0">Stadium</h3><div class="big" style="font-size:28px">${t.stad.toLocaleString()} seats</div><div class="res">${std}. Last home crowd: ${t.att?t.att.toLocaleString()+" ("+fill+"% full)":"none yet"}. Home matches earn £30 per spectator.</div><div style="margin-top:8px"><button ${t.stad>=100000||t.budget<1200?"disabled":""} onclick="expandStadium()">Add 2,000 seats · ${money(1200)}</button></div></div>
 <div class="card"><h3 style="margin-top:0">Training ground</h3><div class="big" style="font-size:28px">Level ${L} of 5</div><div class="res">Training gains ×${(1+.12*(L-1)).toFixed(2)}, rest recovers +${10+3*(L-1)} fitness, injuries can heal faster, and players develop a little better each season.</div><div style="margin-top:8px"><button ${L>=5||t.budget<FC[L-1]?"disabled":""} onclick="upgradeFac()">${L>=5?"Maximum level":"Upgrade · "+money(FC[L-1])}</button></div></div>
 <div class="card"><h3 style="margin-top:0">Youth academy</h3><div class="big" style="font-size:28px">Level ${C.acad} of 5</div><div class="res">New prospects arrive each season: more and better at higher levels. Sign them (3-year deal) before they turn 20 or they leave. Pot is their expected peak rating.</div><div style="margin:8px 0"><button ${C.acad>=5||t.budget<FCA[C.acad-1]?"disabled":""} onclick="upgradeAcad()">${C.acad>=5?"Maximum level":"Upgrade · "+money(FCA[C.acad-1])}</button></div>${C.youth.map(p=>prow(p,t,`<div style="display:flex;flex-direction:column;gap:4px"><button ${t.players.length>=20?"disabled":""} onclick="promoteY(${p.id})">Sign</button><button onclick="releaseY(${p.id})">Release</button></div>`)).join("")||'<div class="res">No prospects yet. New ones arrive at the start of each season.</div>'}</div>
 <div class="card"><h3 style="margin-top:0">Fan base</h3><div class="big" style="font-size:28px">${t.fans.toLocaleString()} supporters</div><div class="res">Mood: ${mood}. Wins, trophies and promotion grow the fan base; defeats and relegation shrink it.</div><div style="margin-top:8px">${C.form.map(x=>`<span class="chip ${x}">${x}</span>`).join("")}</div></div>
 <div class="card"><h3 style="margin-top:0">Retired players</h3>${C.retired.slice(0,8).map(r=>`<div class="row" style="padding:5px 0">${r.n} (${r.pos}, ${r.age}), season ${r.s}: ${r.ap} apps, ${r.g} goals, ${r.a} assists</div>`).join("")||'<div class="res">Nobody has retired yet. Players aged 33 and over may retire at season end.</div>'}</div>
 <div class="card"><h3 style="margin-top:0">Season history</h3>${C.hist.slice().reverse().map(h=>`<div class="row" style="padding:5px 0">Season ${h.s}: ${DIVN[h.d]}, ${h.pos}${ord(h.pos)} · Cup: ${h.cup}${h.cl&&h.cl!=="-"?` · Champions League: ${h.cl}`:""}</div>`).join("")||'<div class="res">No completed seasons yet.</div>'}</div>`}
function expandStadium(){const t=S.teams[S.user];if(t.budget<1200||t.stad>=100000)return;t.budget-=1200;t.stad+=2000;save();render()}
function upgradeFac(){const t=S.teams[S.user];if(t.fac>=5||t.budget<FC[t.fac-1])return;t.budget-=FC[t.fac-1];t.fac++;save();render()}
function upgradeAcad(){const t=S.teams[S.user],C=S.club;if(C.acad>=5||t.budget<FCA[C.acad-1])return;t.budget-=FCA[C.acad-1];C.acad++;save();render()}
function promoteY(id){const t=S.teams[S.user],C=S.club,p=C.youth.find(x=>x.id===id);if(!p||t.players.length>=20)return;C.youth=C.youth.filter(x=>x!==p);p.contract=3;p.wage=wageOf(p);t.players.push(p);S.msg=`${p.name} signed from the academy.`;save();render()}
function releaseY(id){S.club.youth=S.club.youth.filter(x=>x.id!==id);save();render()}
function renew(id){const t=S.teams[S.user],p=t.players.find(x=>x.id===id);if(!p||t.budget<p.wage||p.contract>=4)return;t.budget-=p.wage;p.wage=Math.round(Math.max(p.wage,wageOf(p))*(p.mn==="Ambitious"?1.2:1));p.contract=Math.min(5,p.contract+3);S.msg=`${p.name} signed a new deal.`;save();render()}
function selView(v){if(/^L\d$/.test(v)){sub="league";tview=+v.slice(1)}else sub=v;render()}
function setT(k,v){S.teams[S.user].tac[k]=v;save();render()}
function setTrain(k){S.teams[S.user].train=k;save();render()}
function buy(id){const t=S.teams[S.user],p=S.mk.find(x=>x.id===id);if(!p||t.budget<value(p))return;t.budget-=value(p);t.players.push(p);S.mk=S.mk.filter(x=>x.id!==id);S.msg=`Signed ${p.name}.`;save();render()}
function sell(id){const t=S.teams[S.user],p=t.players.find(x=>x.id===id);t.budget+=Math.round(value(p)*.9);t.players=t.players.filter(x=>x.id!==id);S.msg=`Sold ${p.name}.`;save();render()}
function nextSeason(){const T=S.teams,u=T[S.user],d=u.div,pos=posIn(),AW=awards(d),D=LV.map(i=>sorted(i).map(e=>e[0])),C=S.club,PR=[3000,2000,1500,1000,800,600,400,300],notes=[];
 let bonus=PR[pos-1]*DM[d];if(S.cup.champ===S.user)bonus+=2000;else if(S.cup.runner===S.user)bonus+=800;if(S.cl.champ===S.user)bonus+=3000;else if(S.cl.runner===S.user)bonus+=1200;
 AW.filter(a=>a.tid===S.user).forEach(a=>C.awards.push({s:S.season,k:a.k,name:a.name,v:a.v}));
 const TR=C.trophies;if(pos===1)TR.league[d]++;if(S.cup.champ===S.user)TR.cup++;else if(S.cup.runner===S.user)TR.runner++;if(S.cl.champ===S.user)TR.cl++;else if(S.cl.runner===S.user)TR.clRunner++;
 const inCL=(S.cl.q||[]).includes(S.user);
 C.hist.push({s:S.season,d,pos,cup:S.cup.champ===S.user?"Winners":S.cup.runner===S.user?"Runners-up":"Out",cl:!inCL?"-":S.cl.champ===S.user?"Winners":S.cl.runner===S.user?"Runners-up":"Played"});C.form=[];
 const qual=LV.flatMap(i=>D[i].slice(0,2)),wb=u.players.reduce((s,p)=>s+p.wage,0);
 T.forEach(t=>{const td=t.div,p=D[td].indexOf(t.id)+1;if(t!==u)t.budget+=Math.round(PR[p-1]*DM[td]);t.budget-=t.players.reduce((s,x)=>s+x.wage,0);
  let f=1;if(p===1)f*=1.1;if(td>0&&p<=2)f*=1.15;if(td<7&&p>=7)f*=.9;if(S.cup.champ===t.id)f*=1.08;if(S.cl.champ===t.id)f*=1.12;t.fans=Math.min(250000,Math.max(1000,Math.round(t.fans*f)))});
 u.budget+=Math.round(bonus);
 for(const i of[1,2,3,4,5,6,7]){D[i].slice(0,2).forEach(id=>T[id].div=i-1);D[i-1].slice(-2).forEach(id=>T[id].div=i)}
 if(u.div<d){u.budget+=1500;TR.promo++;notes.push(`Promoted to ${DIVN[u.div]}!`)}else if(u.div>d)notes.push(`Relegated to ${DIVN[u.div]}.`);
 T.forEach(t=>{const mine=t===u;t.players=t.players.filter(p=>{Object.keys(p.st).forEach(k=>{p.ct[k]+=p.st[k];p.st[k]=0});p.age++;p.fit=100;p.inj=p.susp=p.yc=0;
   if(p.age>=33&&Math.random()<cl((p.age-32)*.16,0,1)||p.age>=38){if(mine){C.retired.unshift({n:p.name,pos:p.pos,age:p.age,s:S.season,ap:p.ct.ap,g:p.ct.g,a:p.ct.a});notes.push(`${p.name} retired at ${p.age}.`)}return false}
   if(--p.contract<=0){if(mine){notes.push(`${p.name} left as the contract expired.`);return false}p.contract=R(2,4)}
   const g=p.age<26?(ovr(p)<p.pot?R(1,3):R(-1,1)):p.age<30?R(-1,1):-R(0,3);["pac","pas","sho","def"].forEach(k=>p[k]=cl(p[k]+g+R(-1,1)+(Math.random()<.1*(t.fac-1)?1:0)+(p.mn==="Ambitious"&&p.age<30?1:0),20,92));
   if(!mine)p.wage=wageOf(p);return true})});
 const tri=fillSquad(u,false);if(tri.length)notes.push(`${tri.length} trialist${tri.length>1?"s":""} signed to fill the squad.`);
 T.filter(t=>t!==u).forEach(t=>{fillSquad(t,true);let k=0;while(t.fans*.62>t.stad&&t.stad<100000&&t.budget>2500&&k++<2){t.stad+=2000;t.budget-=1200}if(t.fac<5&&t.budget>FC[t.fac-1]*2.5){t.budget-=FC[t.fac-1];t.fac++}});
 C.youth.forEach(p=>{p.age++;const g=R(2,5);["pac","pas","sho","def"].forEach(k=>p[k]=cl(p[k]+g+R(-1,1),20,85))});
 C.youth=C.youth.filter(p=>p.age<=19||(notes.push(`${p.name} left the academy.`),false));
 for(let i=R(1,1+Math.ceil(C.acad/2));i>0&&C.youth.length<6;i--){const y=mk(pick(["GK","DF","DF","MF","MF","FW","FW"]),36+3*C.acad+R(-3,3));y.age=R(16,17);y.pot=cl(ovr(y)+R(12,26)+2*C.acad,55,93);y.wage=30;y.contract=3;C.youth.push(y)}
 S.season++;S.round=0;S.step=0;S.cal=CAL;S.table=freshTable();S.cup=newCup();S.cl=newCL(qual);S.fx=schedAll();S.mk=market();S.last=null;tview=null;sub="league";
 S.msg=[`Prize money: ${money(Math.round(bonus))}. Wages paid: ${money(wb)}.`,...notes].join(" ");save();render()}
let W={mgr:"",pic:0,club:"",col:"#1f6fb2",shape:"shield"};
const COLS=["#1f6fb2","#c0392b","#1e8449","#d49a00","#7d3c98","#d35400","#139a9a","#2c3e50"],clean=v=>(v||"").replace(/[^\p{L}\p{N} .'’-]/gu,"").replace(/\s+/g," ").trim().slice(0,24);
const iniOf=n=>{const w=clean(n).split(" ").filter(Boolean);return(w.length>1?w[0][0]+w[1][0]:(w[0]||"FC").slice(0,2)).toUpperCase()};
function setW(k,v){W[k]=v;render()}
function startGame(){const mgr=clean(W.mgr),club=clean(W.club);if(mgr.length<2||club.length<3){W.err="Please enter your name (2+ letters) and a club name (3+ letters).";render();return}
 W.err="";newGame({mgr,pic:W.pic,club,col:W.col,ini:iniOf(club),shape:W.shape});tab="home";render()}
function vWelcome(){const ini=iniOf(W.club||"New Club");
 return`<div class="top"><h1>Touchline Manager</h1></div>
 <div class="card pitchcard"><h2>Welcome to the Streets</h2><p>Every great club starts somewhere. You are about to found a brand-new club in the <b>Streets League</b>, the bottom of an eight-level football pyramid. Win your league, earn promotion and climb through seven more levels until you reach the <b>Global League</b> and the Champions League.</p><p>Build a squad, set your tactics, train players, develop youth from your academy, manage contracts and mentalities, and grow your stadium and fan base. Clubs and players are fictional.</p></div>
 <div class="card"><h3 style="margin-top:0">Your manager</h3><input id="mname" value="${W.mgr}" placeholder="Your name" maxlength="24" oninput="W.mgr=this.value" style="width:100%;padding:10px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit"><div class="res" style="margin:10px 0 6px">Choose your picture</div>
 <div class="seg">${MG.map((m,i)=>`<button class="${W.pic===i?"on":""}" style="padding:4px" aria-label="Manager ${i+1}: ${MGN[i]}" onclick="setW('pic',${i})">${mgrFace(i,58)}</button>`).join("")}</div></div>

 <div class="res" style="margin:10px 0 6px">Club emblem</div><div class="seg">${SHL.map(s=>`<button class="${W.shape===s?"on":""}" style="padding:4px" aria-label="${s} emblem" onclick="setW('shape','${s}')">${badge({col:W.col,ini,shape:s},34)}</button>`).join("")}</div>
 ${W.err?`<p class="lose">${W.err}</p>`:""}<div style="margin-top:14px"><button class="pri" onclick="startGame()">Start my career</button></div></div>`}
function saveBox(){const d=S.saved?new Date(S.saved).toLocaleString():"not yet";
 return`<div class="card"><h3 style="margin-top:0">Save</h3><div class="res">${saveOk?`Auto-saved after every action in this browser. Last saved: ${d}`:`<span class="lose">Saving is blocked in this browser. Export your game to keep it.</span>`}</div>

function exportSave(){save();const b=new Blob([JSON.stringify(S)],{type:"application/json"}),a=document.createElement("a");
 a.href=URL.createObjectURL(b);a.download=`touchline-${S.teams[S.user].ini}-season${S.season}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function importSave(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();
 r.onload=()=>{try{const x=JSON.parse(r.result);if(x.v!==5||!x.mgr||!Array.isArray(x.teams)||x.teams.length!==64||!x.fx||!x.table||!x.cup||!x.club)throw 0;S=x;fixNid();tab="home";live=null;tview=null;save();render()}
  catch(e){alert("That file is not a valid save for this version of Touchline Manager.")}};r.readAsText(f);inp.value=""}

function render(){const app=document.getElementById("app"),tb=document.getElementById("tabs");
 if(!S){tb.style.display="none";app.innerHTML=vWelcome()+importBox();return}
 tb.style.display="flex";const t=S.teams[S.user];
 tb.innerHTML=[["home","Home"],["squad","Squad"],["tac","Tactics"],["table","Table"],["club","Club"],["mkt","Transfers"]].map(([k,v])=>`<button class="${tab===k?"on":""}" onclick="tab='${k}';S.msg='';render()">${v}</button>`).join("");

 app.innerHTML=`<div class="top"><div style="display:flex;gap:10px;align-items:center">${badge(t,0).replace("<svg",'<svg style="width:30px;height:35px"')}<div><h1>${t.name}</h1><div class="res">${DIVN[t.div]} · Season ${S.season}</div></div></div><div class="money">${money(t.budget)}</div></div>${body}`}
if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
load();render();
</script>
