<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Touchline Manager</title>
<meta name="theme-color" content="#1d5a37">
<meta name="description" content="A text-based football manager. Play in your browser; your progress is saved.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#e8eee6;--panel:#f7faf5;--ink:#13271b;--mute:#5d7064;--line:#cbd6c9;--acc:#c98a00;--accink:#fff;--good:#1e7a46;--bad:#b3392b;--pitch:#1d5a37;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1a12;--panel:#15271c;--ink:#e6efe6;--mute:#8fa597;--line:#27402f;--acc:#f0b429;--accink:#1a1300;--good:#4cc27f;--bad:#ef7a6a;--pitch:#18452b}}
:root[data-theme="dark"]{--bg:#0d1a12;--panel:#15271c;--ink:#e6efe6;--mute:#8fa597;--line:#27402f;--acc:#f0b429;--accink:#1a1300;--good:#4cc27f;--bad:#ef7a6a;--pitch:#18452b}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:500 15px/1.45 Barlow,system-ui,sans-serif}
h1,h2,h3,.big{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;margin:0;letter-spacing:.01em}
h2{font-size:24px;margin-bottom:10px}h3{font-size:18px;margin:14px 0 6px}
#wrap{max-width:640px;margin:0 auto;padding:14px 14px 90px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.top h1{font-size:22px}.money{font-weight:600;color:var(--acc)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.pitchcard{background:var(--pitch);color:#f2f7f2;border:0;background-image:linear-gradient(90deg,transparent 49.7%,rgba(255,255,255,.14) 49.7% 50.3%,transparent 50.3%)}
.vs{display:flex;align-items:center;justify-content:space-around;text-align:center;gap:6px}
.vs svg{width:56px;height:64px}.vs .nm{font-weight:600;font-size:14px}
.score{font-size:46px;line-height:1}.min{font-size:15px;opacity:.85}
button{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:9px;padding:9px 14px;cursor:pointer}
button.pri{background:var(--acc);color:var(--accink);border-color:var(--acc)}
button.on{outline:2px solid var(--acc)}button:disabled{opacity:.5}
button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}.row svg.av{width:38px;height:38px;flex:none}
.row .g{flex:1;min-width:0}.row .s{font-size:12.5px;color:var(--mute)}
.pos{display:inline-block;min-width:34px;text-align:center;font-size:12px;font-weight:700;border-radius:5px;padding:1px 5px;color:#fff}
.GK{background:#b9770e}.DF{background:#2874a6}.MF{background:#1e8449}.FW{background:#b03a2e}
.ovr{font-family:"Barlow Condensed",sans-serif;font-size:22px;font-weight:700;width:34px;text-align:right}
.bar{height:5px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:3px;width:60px}.bar i{display:block;height:100%;background:var(--good)}
.feed{max-height:300px;overflow:auto;margin-top:12px;font-size:14.5px}
.feed div{padding:5px 0;border-top:1px solid rgba(255,255,255,.15)}.feed b{display:inline-block;width:34px}
.feed .g{color:#ffd35c;font-weight:700}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:7px 4px;text-align:center;border-bottom:1px solid var(--line)}
th{font-size:12px;color:var(--mute)}td:nth-child(2),th:nth-child(2){text-align:left}tr.me td{background:rgba(201,138,0,.16);font-weight:700}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);display:flex;justify-content:center;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));gap:4px}
.tabs button{flex:1;max-width:110px;border:0;background:none;color:var(--mute);padding:8px 4px}.tabs button.on{color:var(--ink);outline:0;box-shadow:inset 0 -3px var(--acc)}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:10px}.pick button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px}
.pick svg{width:52px;height:60px}.seg{display:flex;gap:8px;flex-wrap:wrap}
.res{font-size:14px;color:var(--mute)}.win{color:var(--good)}.lose{color:var(--bad)}
.tabs button{font-size:13px;padding:8px 2px}.shelf{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;padding:8px 6px 4px;border-bottom:6px solid var(--line);min-height:56px}.shelf figure{margin:0;text-align:center;font-size:11px;color:var(--mute)}.chip{display:inline-block;width:24px;height:24px;line-height:24px;text-align:center;border-radius:6px;color:#fff;font-weight:700;margin-right:4px;font-size:13px}.chip.W{background:var(--good)}.chip.D{background:#8a8f94}.chip.L{background:var(--bad)}
</style>
</head>
<body>
<div id="wrap"><div id="app"></div></div>
<div class="tabs" id="tabs"></div>
<script>
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1)),pick=a=>a[Math.floor(Math.random()*a.length)],cl=(x,a,b)=>Math.max(a,Math.min(b,x));
const FN=["Luca","Marco","Tomas","Jonas","Ravi","Diego","Kofi","Mateo","Ivan","Sami","Leo","Niko","Omar","Felix","Hugo","Yusuf","Andre","Pablo","Erik","Tariq"];
const LN=["Silva","Okoye","Brandt","Moreau","Petrov","Costa","Lindqvist","Haddad","Novak","Ruiz","Adeyemi","Fischer","Rossi","Tanaka","Varga","Mensah","Duarte","Kovac","Santos","Berg"];
const CLUBS=[["Harbor Rovers","#1f6fb2","HR"],["Red Mill United","#c0392b","RM"],["Northgate City","#7d3c98","NC"],["Ironbridge Town","#556270","IT"],["Sunvale Athletic","#d49a00","SA"],["Greenfield FC","#1e8449","GF"],["Stoneport Wanderers","#d35400","SW"],["Kingsway Albion","#139a9a","KA"],
["Eastvale Rovers","#b7410e","ER"],["Lakeside Town","#2e86c1","LT"],["Oakham United","#6e4b2a","OU"],["Fenwick Athletic","#c2185b","FA"],["Redcliffe City","#a93226","RC"],["Marlow Wanderers","#117a65","MW"],["Thornbury FC","#34495e","TF"],["Ashford Albion","#af7ac5","AA"],
["Brookside FC","#2874a6","BF"],["Cliffhaven Town","#7f8c8d","CT"],["Dunmore Rovers","#cb4335","DR"],["Elmwood United","#229954","EU"],["Foxhill Athletic","#ca6f1e","FH"],["Glenrock City","#5b2c6f","GC"],["Hartley Wanderers","#1b4f72","HW"],["Ironvale Albion","#b9770e","IA"]];
const DIVN=["Division 1","Division 2","Division 3"],FORMS={"442":{DF:4,MF:4,FW:2},"433":{DF:4,MF:3,FW:3},"352":{DF:3,MF:5,FW:2}},MENT={atk:"Attack",bal:"Balanced",def:"Defend"};
const CAL="LLCLLLCLLLCLLLCLLLC",CUPR=["Preliminary round","Round of 16","Quarter-finals","Semi-finals","Final"];
const TRAIN={rest:"Rest & recovery",sho:"Shooting",pas:"Passing",def:"Defending",pac:"Pace"};
let S=null,tab="home",live=null,timer=null,nid=1,tview=null,sub="league",ssub="players";
const SK=["#f1c9a5","#d9a273","#a96d45","#7a4a2c","#4e2e1b"],HR=["#1c1410","#4a3020","#8a5a2b","#c9a050","#2b2b2b"];
const avail=p=>!p.inj&&!p.susp;
function ovr(p){const{pac,pas,sho,def}=p;return Math.round(p.pos==="GK"?def:p.pos==="DF"?def*.6+pac*.2+pas*.2:p.pos==="MF"?pas*.5+def*.2+sho*.15+pac*.15:sho*.55+pac*.3+pas*.15)}
const eff=p=>ovr(p)*(.85+.15*p.fit/100);
const z=()=>({ap:0,g:0,a:0,cs:0,mom:0});
function mk(pos,b){const hi=()=>cl(b+R(-3,6),30,92),lo=()=>cl(b-R(8,20),20,80);
 const st={GK:{def:hi(),pac:lo(),pas:lo(),sho:20},DF:{def:hi(),pac:lo()+8,pas:lo()+6,sho:lo()},MF:{pas:hi(),def:lo()+6,pac:lo()+8,sho:lo()+6},FW:{sho:hi(),pac:hi()-4,pas:lo()+8,def:25}}[pos];
 return{id:nid++,name:pick(FN)+" "+pick(LN),age:R(18,34),pos,fit:100,st:z(),ct:z(),inj:0,susp:0,yc:0,...st}}
function mkTeam(i){const d=Math.floor(i/8),b=[R(62,72),R(56,66),R(50,60)][d],sq=[];[["GK",2],["DF",5],["MF",5],["FW",4]].forEach(([p,n])=>{for(let k=0;k<n;k++)sq.push(mk(p,b))});
 return{id:i,shape:SH[i],name:CLUBS[i][0],col:CLUBS[i][1],ini:CLUBS[i][2],div:d,players:sq,budget:[20000,12000,8000][d],tac:{form:"442",ment:"bal"},train:"rest"}}
const value=p=>Math.max(300,Math.round((ovr(p)-45)**2*20*(p.age>30?.6:1)/50)*50);
function sched(ids){ids=ids.slice();const rs=[];for(let r=0;r<7;r++){const m=[];for(let i=0;i<4;i++){const a=ids[i],b=ids[7-i];m.push(r%2?[b,a]:[a,b])}rs.push(m);ids.splice(1,0,ids.pop())}
 return rs.concat(rs.map(r=>r.map(([h,a])=>[a,h])))}
function schedAll(){const s=[0,1,2].map(d=>sched(S.teams.filter(t=>t.div===d).map(t=>t.id)));return[...Array(14).keys()].map(r=>[].concat(...s.map(x=>x[r])))}
const freshTable=()=>Object.fromEntries([...Array(24).keys()].map(i=>[i,{p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0}]));
const newCup=()=>({r:0,alive:[...Array(24).keys()],log:[],champ:null,runner:null,next:[]});
function market(){const m=[];["GK","DF","DF","MF","MF","FW","FW","FW"].forEach(p=>{const x=mk(p,R(58,76));x.age=R(19,32);m.push(x)});return m}
function newGame(u){S={teams:CLUBS.map((_,i)=>mkTeam(i)),user:u,round:0,step:0,table:freshTable(),cup:newCup(),mk:market(),last:null,season:1,msg:"",inj:[],v:3,club:mkClub(Math.floor(u/8))};S.fx=schedAll();tview=null;sub="league";save()}
const SH=["triangle","cross","hexagon","arch","star","circle","diamond","pentagon","square","circle","shield","pentagon","triangle","diamond","star","square","circle","triangle","hexagon","shield","pentagon","diamond","cross","arch"];
const mkClub=d=>({stad:[30000,15000,6000][d],fans:[40000,20000,9000][d],fac:1,att:0,form:[],trophies:{league:[0,0,0],cup:0,runner:0,promo:0},awards:[],hist:[]});
const fixP=p=>{p.st={ap:0,g:p.goals||0,a:0,cs:0,mom:0};p.ct=z();delete p.goals};
function migrate(x){x.teams.forEach(t=>{t.shape=SH[t.id];t.players.forEach(fixP)});x.mk.forEach(fixP);x.club=mkClub(x.teams[x.user].div);x.v=3;return true}
let saveOk=true;
function save(){try{S.v=3;S.saved=Date.now();localStorage.setItem("tm1",JSON.stringify(S));saveOk=true}catch(e){saveOk=false}}
function fixNid(){nid=Math.max(...S.teams.flatMap(t=>t.players.map(p=>p.id)),...S.mk.map(p=>p.id))+1}
function load(){try{const s=localStorage.getItem("tm1");if(s){S=JSON.parse(s);if(S.v===2)migrate(S);if(S.v!==3||S.teams.length!==24)S=null;else fixNid()}}catch(e){S=null}}

function lineup(t){const f=FORMS[t.tac.form],o=[],ok=t.players.filter(avail);
 for(const pos of["GK","DF","MF","FW"]){const n=pos==="GK"?1:f[pos];o.push(...ok.filter(p=>p.pos===pos).sort((a,b)=>eff(b)-eff(a)).slice(0,n))}
 if(o.length<11)o.push(...ok.filter(p=>!o.includes(p)).sort((a,b)=>eff(b)-eff(a)).slice(0,11-o.length));return o}
function strength(t,home){const L=lineup(t),av=pos=>{const x=L.filter(p=>p.pos===pos);return x.length?x.reduce((s,p)=>s+eff(p),0)/x.length:40},k=t.tac.ment==="atk"?4:t.tac.ment==="def"?-4:0,h=home?2:0;
 return{A:(av("FW")*2+av("MF"))/3+k+h,D:(av("DF")*2+av("GK"))/3-k+h,M:av("MF")+h,gk:av("GK"),L}}
function sim(h,a){const H=strength(h,1),A=strength(a,0),ev=[],fresh=[],inc=[];let gh=0,ga=0;
 const E=(m,t,k)=>ev.push({m,t,k,sh:gh,sa:ga});
 E(0,`Kick-off! ${h.name} host ${a.name}.`,"i");
 const L0={h:H.L.slice(),a:A.L.slice()},mg={},ma={};[...H.L,...A.L].forEach(p=>p.st.ap++);
 for(let m=1;m<=90;m++){
  if(m===46)E(45,`Half-time: ${h.name} ${gh}–${ga} ${a.name}.`,"i");
  const x=Math.random();
  if(x<.0092){const hs=Math.random()<.5,T=hs?h:a,X=hs?H:A,p=pick(X.L.filter(q=>q.pos!=="GK"&&!fresh.includes(q.id))),n=p&&p.name.split(" ")[1];
   if(p){if(x<.0025){p.inj=R(1,6);fresh.push(p.id);X.L=X.L.filter(q=>q!==p);X.A-=1.5;X.D-=1.5;E(m,`${n} (${T.name}) is injured and limps off.`,"n");inc.push({id:T.id,txt:`${p.name} injured for ${p.inj} matches.`})}
    else if(x<.0037){p.susp=R(1,3);fresh.push(p.id);X.L=X.L.filter(q=>q!==p);X.A-=5;X.D-=5;X.M-=4;E(m,`RED CARD! ${n} (${T.name}) is sent off. ${T.name} are down to ten.`,"r");inc.push({id:T.id,txt:`${p.name} sent off, banned for ${p.susp} matches.`})}
    else{p.yc++;if(p.yc>=3){p.yc=0;p.susp=1;fresh.push(p.id);E(m,`Yellow card for ${n} (${T.name}). A third booking means a one-match ban.`,"n");inc.push({id:T.id,txt:`${p.name} banned for 1 match (3 yellow cards).`})}else E(m,`Yellow card for ${n} (${T.name}).`,"n")}}
   continue}
  if(Math.random()>.17)continue;
  const ph=Math.pow(H.M,3)/(Math.pow(H.M,3)+Math.pow(A.M,3)),hs=Math.random()<ph,at=hs?H:A,df=hs?A:H,tm=hs?h:a,op=hs?a:h;
  const mf=at.L.filter(p=>p.pos==="MF"),fw=at.L.filter(p=>p.pos==="FW"),wp=at.L.filter(p=>p.pos!=="GK").map(p=>({p,w:Math.pow(p.sho,2)*(p.pos==="FW"?3:p.pos==="MF"?1:.25)}));
  let r=Math.random()*wp.reduce((s,x)=>s+x.w,0),sc=wp[0].p;for(const y of wp){r-=y.w;if(r<=0){sc=y.p;break}}
  const pool=at.L.filter(p=>p!==sc&&p.pos!=="GK"),as=pick(pool.length?pool:at.L),sn=sc.name.split(" ")[1],an=as.name.split(" ")[1];
  if(Math.random()>cl(.4+(at.A-df.D)/120,.15,.8)){if(Math.random()<.35)E(m,pick([`${tm.name} build up well but ${op.name} close the door.`,`${an} loses the ball in a dangerous area.`,`A promising move from ${tm.name} ends with an offside flag.`]),"n");continue}
  if(Math.random()<cl(.3+(at.A-df.gk)/150,.1,.6)){hs?gh++:ga++;sc.st.g++;mg[sc.id]=(mg[sc.id]||0)+1;if(as!==sc){as.st.a++;ma[as.id]=(ma[as.id]||0)+1}
   E(m,`GOAL! ${sn} ${pick(["slots it home","fires into the corner","heads in from close range","finishes coolly"])} after a pass from ${an}. ${tm.name} score!`,"g")}
  else{const gk=(df.L.find(p=>p.pos==="GK")||df.L[0]).name.split(" ")[1];E(m,pick([`${sn} shoots… great save by ${gk}!`,`${sn} blasts it over the bar.`,`${sn} hits the post! So close for ${tm.name}.`,`${gk} tips ${sn}’s effort round the post.`]),"n")}}
 const cs=(L,g)=>{if(g===0)L.filter(p=>p.pos==="GK"||p.pos==="DF").forEach(p=>p.st.cs++)};cs(L0.h,ga);cs(L0.a,gh);
 let best=null,bs=-1;[...L0.h.map(p=>[p,gh>ga,ga]),...L0.a.map(p=>[p,ga>gh,gh])].forEach(([p,w,conc])=>{const v=(mg[p.id]||0)*3+(ma[p.id]||0)*2+(conc===0?(p.pos==="GK"?3:p.pos==="DF"?1.5:0):0)+(w?1:0)+Math.random()*1.5;if(v>bs){bs=v;best=p}});
 best.st.mom++;E(90,`Man of the match: ${best.name}.`,"i");
 E(90,`Full-time: ${h.name} ${gh}–${ga} ${a.name}.`,"i");return{h:h.id,a:a.id,gh,ga,ev,fresh,inc}}

function apply(h,a,gh,ga){const T=S.table,H=T[h],A=T[a];H.p++;A.p++;H.gf+=gh;H.ga+=ga;A.gf+=ga;A.ga+=gh;
 if(gh>ga){H.w++;A.l++;H.pts+=3}else if(gh<ga){A.w++;H.l++;A.pts+=3}else{H.d++;A.d++;H.pts++;A.pts++}}
function cupDraw(){const c=S.cup;let ids=c.alive.slice(),byes=[];if(c.r===0){byes=ids.filter(i=>S.teams[i].div===0);ids=ids.filter(i=>S.teams[i].div!==0)}
 ids.sort(()=>Math.random()-.5);const p=[];for(let i=0;i<ids.length;i+=2)p.push([ids[i],ids[i+1]]);c.next=byes;return p}
function runEvent(){const cup=CAL[S.step]==="C",T=S.teams,u=S.user,c=S.cup,pairs=cup?cupDraw():S.fx[S.round],played=new Set(),fresh=new Set(),lines=[];let mine=null;S.inj=[];
 pairs.forEach(([h,a])=>{const H=T[h],A=T[a],me=h===u||a===u;[...lineup(H),...lineup(A)].forEach(p=>played.add(p.id));
  const r=sim(H,A);r.fresh.forEach(x=>fresh.add(x));r.inc.forEach(i=>{if(i.id===u)S.inj.push(i.txt)});
  if(cup){let w=r.gh>r.ga?h:r.gh<r.ga?a:null,pen="";
   if(w===null){w=Math.random()<.5?h:a;const x=R(3,5);pen=`${T[w].name} win ${x}–${x-R(1,2)} on penalties`;r.ev.push({m:90,t:pen+".",k:"i",sh:r.gh,sa:r.ga})}
   r.win=w;c.next.push(w);lines.push(`${me?"<b>":""}${H.name} ${r.gh}–${r.ga} ${A.name}${pen?` (${pen})`:""}${me?"</b>":""}`);if(c.r===4){c.champ=w;c.runner=w===h?a:h}}
  else apply(h,a,r.gh,r.ga);
  if(me)mine=r});
 if(cup){c.log.push({n:CUPR[c.r],m:lines});c.alive=c.next;c.r++}else S.round++;
 const label=cup?"Cup · "+CUPR[c.r-1]:DIVN[T[u].div]+" · Matchday "+S.round,me=T[u],rest=me.train==="rest",gains=[],FL=S.club.fac;
 T.forEach(t=>t.players.forEach(p=>{const m=t===me;p.fit=played.has(p.id)?Math.max(55,p.fit-9):Math.min(100,p.fit+12+(m&&rest?10+3*(FL-1):0));
  if(!fresh.has(p.id)){p.inj=Math.max(0,p.inj-1-(m&&rest?1:0)-(m&&Math.random()<.12*(FL-1)?1:0));p.susp=Math.max(0,p.susp-1)}
  if(m&&!rest&&p[me.train]<92&&Math.random()<(p.age<24?.3:p.age<29?.18:.07)*(1+.12*(FL-1))){p[me.train]++;if(gains.length<3)gains.push(`${p.name.split(" ")[1]} +1 ${me.train.toUpperCase()}`)}}));
 let att=0;if(mine){const C=S.club,home=mine.h===u,w=cup?mine.win===u:(home?mine.gh>mine.ga:mine.ga>mine.gh),dr=!cup&&mine.gh===mine.ga;
  if(home){att=Math.min(C.stad,Math.round(C.fans*.6*(.92+Math.random()*.12)));C.att=att}
  const gate=Math.round(att*(cup?15:30)/1000);me.budget+=cup?(home?gate:100)+(w?400:0):(home?gate:150)+(w?500:dr?150:0);
  C.form=[...C.form,w?"W":dr?"D":"L"].slice(-5);C.fans=Math.round(C.fans*(w?1.008:dr?1:.994));S.last={h:mine.h,a:mine.a,gh:mine.gh,ga:mine.ga,cup}}
 S.step++;S.mk=market();S.msg=[att?`Attendance: ${att.toLocaleString()}.`:"",...S.inj,gains.length?"Training: "+gains.join(", ")+".":""].join(" ").trim();save();return mine?{...mine,label}:null}
function play(){if(live||S.step>=CAL.length)return;const r=runEvent();if(r){live={...r,i:0};tick();timer=setInterval(tick,420)}else render()}
function tick(){if(!live)return;live.i++;if(live.i>=live.ev.length)clearInterval(timer);render()}
function skip(){clearInterval(timer);live.i=live.ev.length;render()}
function closeLive(){live=null;render()}

const SHP={shield:'<path d="M3 3h34v22c0 10-9 16-17 19C12 41 3 35 3 25z"/>',circle:'<circle cx="20" cy="23" r="19"/>',hexagon:'<polygon points="20,2 37,12 37,34 20,44 3,34 3,12"/>',diamond:'<polygon points="20,1 38,23 20,45 2,23"/>',star:'<polygon points="20,1 25.5,16 38,16 28,26 32,42 20,33 8,42 12,26 2,16 14.5,16"/>',triangle:'<polygon points="20,2 38,42 2,42"/>',pentagon:'<polygon points="20,2 38,17 31,43 9,43 2,17"/>',cross:'<polygon points="14,2 26,2 26,14 38,14 38,26 26,26 26,44 14,44 14,26 2,26 2,14 14,14"/>',arch:'<path d="M3 44V21a17 17 0 0134 0v23z"/>',square:'<rect x="3" y="4" width="34" height="38" rx="7"/>'},TY={triangle:37,star:30,pentagon:31,arch:35,cross:29},TF={triangle:11,star:10,cross:11,arch:13};
function badge(t,s){const sh=t.shape||"shield";return`<svg viewBox="0 0 40 46" ${s?`style="width:${s}px;height:${s*1.15}px"`:""}><g fill="${t.col}" stroke="rgba(255,255,255,.55)" stroke-width="1.5">${SHP[sh]}</g><text x="20" y="${TY[sh]||29}" text-anchor="middle" font-size="${TF[sh]||14}" font-weight="700" font-family="Barlow Condensed,Arial" fill="#fff">${t.ini}</text></svg>`}
function av(p,col){const k=SK[p.id%5],h=HR[(p.id*3)%5];return`<svg class="av" viewBox="0 0 40 40"><rect width="40" height="40" rx="9" fill="${col}" opacity=".22"/><path d="M5 40c0-9 7-12 15-12s15 3 15 12z" fill="${col}"/><circle cx="20" cy="17" r="8" fill="${k}"/><path d="M11.5 16a8.5 8.5 0 0117 0c-3-4.5-14-4.5-17 0z" fill="${h}"/></svg>`}
const money=k=>"£"+(k/1000).toFixed(1)+"m",ord=n=>["th","st","nd","rd"][(n%100>10&&n%100<14)||n%10>3?0:n%10];
function prow(p,t,extra,mark){const st=(p.inj?` · <span class="lose">Injured ${p.inj}</span>`:"")+(p.susp?` · <span class="lose">Banned ${p.susp}</span>`:"")+(p.yc?` · YC ${p.yc}`:"");
 return`<div class="row">${av(p,t.col)}<div class="g"><div><span class="pos ${p.pos}">${p.pos}</span> <b>${p.name}</b>${mark?" ●":""}</div><div class="s">Age ${p.age} · PAC ${p.pac} PAS ${p.pas} SHO ${p.sho} DEF ${p.def}${p.st.g?` · ${p.st.g}G`:""}${p.st.a?` ${p.st.a}A`:""}${st}</div></div><div><div class="ovr">${ovr(p)}</div><div class="bar"><i style="width:${p.fit}%"></i></div></div>${extra||""}</div>`}

 ${out.length?`<div class="card"><h3 style="margin-top:0">Unavailable</h3>${out.map(p=>`<div class="res">${p.pos} ${p.name}: ${p.inj?`injured, ${p.inj} to go`:`suspended, ${p.susp} to go`}</div>`).join("")}</div>`:""}${saveBox()}<button onclick="if(this.dataset.s){S=null;localStorage.removeItem('tm1');render()}else{this.dataset.s=1;this.textContent='Tap again to erase save and restart'}">New game</button>`}

 return`<div class="card"><table><tr><th></th><th>Player</th><th>Ap</th><th>G</th><th>A</th><th>CS</th><th>MoM</th></tr>${ps.map(p=>`<tr><td><span class="pos ${p.pos}">${p.pos}</span></td><td>${p.name}</td><td>${p.st.ap}</td><td>${p.st.g}</td><td>${p.st.a}</td><td>${p.st.cs}</td><td>${p.st.mom}</td></tr>`).join("")}</table></div><p class="res">Season stats (Ap = appearances, CS = clean sheets, shared by the keeper and defenders, MoM = man of the match). They reset each season and are added to career totals.</p>`}
const lead=(d,k,f)=>S.teams.filter(t=>t.div===d).flatMap(t=>t.players.filter(p=>!f||f(p)).map(p=>({p,t}))).filter(x=>x.p.st[k]>0).sort((a,b)=>b.p.st[k]-a.p.st[k]||b.p.st.g-a.p.st.g).slice(0,5);

function awards(d){const all=S.teams.filter(t=>t.div===d).flatMap(t=>t.players.map(p=>({p,t}))),top=(k,f)=>all.filter(x=>!f||f(x.p)).sort((a,b)=>b.p.st[k]-a.p.st[k]||b.p.st.g-a.p.st.g)[0];
 return[["Golden Boot (top scorer)",top("g"),"g"],["Playmaker (most assists)",top("a"),"a"],["Golden Glove (clean sheets)",top("cs",p=>p.pos==="GK"),"cs"],["Player of the Season (man of the match)",top("mom"),"mom"]].filter(x=>x[1]&&x[1].p.st[x[2]]>0).map(([k,x,c])=>({k,name:x.p.name,team:x.t.name,tid:x.t.id,v:x.p.st[c]}))}
const trophy=c=>`<svg viewBox="0 0 24 24" width="30" height="30"><path d="M6 3h12v5a6 6 0 01-12 0z" fill="${c}"/><path d="M6 5H2c0 4 2 6 5 6M18 5h4c0 4-2 6-5 6" fill="none" stroke="${c}" stroke-width="1.6"/><rect x="10.5" y="13" width="3" height="4" fill="${c}"/><rect x="7" y="17" width="10" height="3.5" rx="1" fill="${c}"/></svg>`;
const TC=["#e0a30c","#9aa7b0","#b5703a"],FC=[2500,4000,6000,9000];
function vClub(){const t=S.teams[S.user],C=S.club,tr=C.trophies,L=C.fac,std=t.name.split(" ")[0]+" Park",fill=C.att?Math.round(C.att/C.stad*100):0;
 const fg=(c,n,l)=>Array.from({length:n},()=>`<figure>${trophy(c)}<div>${l}</div></figure>`).join(""),sh=(lb,it)=>`<div class="res" style="margin-top:10px">${lb}</div><div class="shelf">${it||'<span class="res">Empty</span>'}</div>`;
 const pts=C.form.reduce((s,x)=>s+(x==="W"?3:x==="D"?1:0),0),mood=!C.form.length?"Waiting for the first match":pts>=11?"Delighted":pts>=8?"Happy":pts>=5?"Content":pts>=3?"Restless":"Angry";

 <div class="card"><h3 style="margin-top:0">Trophy cabinet</h3>${sh("League titles",[0,1,2].map(d=>fg(TC[d],tr.league[d],DIVN[d])).join(""))}${sh("Cup",fg(TC[0],tr.cup,"Winners")+fg(TC[1],tr.runner,"Runners-up"))}${sh("Promotions",Array.from({length:tr.promo},()=>`<figure><div style="font-size:26px;color:var(--good)">▲</div><div>Promoted</div></figure>`).join(""))}
 ${C.awards.length?`<div class="res" style="margin-top:10px">Player awards</div>${C.awards.map(a=>`<div>${a.k}: <b>${a.name}</b> (season ${a.s}, ${a.v})</div>`).join("")}`:`<p class="res">Win a league, the cup or a promotion to fill the cabinet.</p>`}</div>

function expandStadium(){const t=S.teams[S.user],C=S.club;if(t.budget<1200||C.stad>=60000)return;t.budget-=1200;C.stad+=2000;save();render()}

function buy(id){const t=S.teams[S.user],p=S.mk.find(x=>x.id===id);if(!p||t.budget<value(p))return;t.budget-=value(p);t.players.push(p);S.mk=S.mk.filter(x=>x.id!==id);S.msg=`Signed ${p.name}.`;save();render()}
function sell(id){const t=S.teams[S.user],p=t.players.find(x=>x.id===id);t.budget+=Math.round(value(p)*.9);t.players=t.players.filter(x=>x.id!==id);S.msg=`Sold ${p.name}.`;save();render()}
function nextSeason(){const u=S.teams[S.user],d=u.div,pos=posIn(),AW=awards(d),D=[0,1,2].map(i=>sorted(i).map(e=>e[0]));let bonus=[3000,2000,1500,1000,800,600,400,300][pos-1]*[1.5,1,.7][d],txt="";
 if(S.cup.champ===S.user)bonus+=2000;else if(S.cup.runner===S.user)bonus+=800;
 for(const i of[1,2]){D[i].slice(0,2).forEach(id=>S.teams[id].div=i-1);D[i-1].slice(-2).forEach(id=>S.teams[id].div=i)}
 if(u.div<d){bonus+=1500;txt=`Promoted to ${DIVN[u.div]}! `}else if(u.div>d)txt=`Relegated to ${DIVN[u.div]}. `;
 const C=S.club;AW.filter(a=>a.tid===S.user).forEach(a=>C.awards.push({s:S.season,k:a.k,name:a.name,v:a.v}));
 if(pos===1)C.trophies.league[d]++;if(S.cup.champ===S.user)C.trophies.cup++;else if(S.cup.runner===S.user)C.trophies.runner++;
 if(u.div<d){C.trophies.promo++;C.fans=Math.round(C.fans*1.15)}else if(u.div>d)C.fans=Math.round(C.fans*.9);if(pos===1||S.cup.champ===S.user)C.fans=Math.round(C.fans*1.1);
 C.hist.push({s:S.season,d,pos,cup:S.cup.champ===S.user?"Winners":S.cup.runner===S.user?"Runners-up":"Out"});C.form=[];
 S.teams.forEach(t=>t.players.forEach(p=>{p.age++;Object.keys(p.st).forEach(k=>{p.ct[k]+=p.st[k];p.st[k]=0});p.fit=100;p.inj=p.susp=p.yc=0;const x=p.age<28?R(-1,3):-R(0,3);["pac","pas","sho","def"].forEach(k=>p[k]=cl(p[k]+x+R(-1,1),20,92))}));
 S.teams.forEach(t=>{t.players=t.players.filter(p=>p.age<37||t.players.length<15)});
 u.budget+=Math.round(bonus);S.season++;S.round=0;S.step=0;S.table=freshTable();S.cup=newCup();S.fx=schedAll();S.mk=market();S.last=null;tview=null;sub="league";S.msg=txt+`Prize money: ${money(Math.round(bonus))}.`;save();render()}

function saveBox(){const d=S.saved?new Date(S.saved).toLocaleString():"not yet";
 return`<div class="card"><h3 style="margin-top:0">Save</h3><div class="res">${saveOk?`Auto-saved after every action in this browser. Last saved: ${d}`:`<span class="lose">Saving is blocked in this browser. Export your game to keep it.</span>`}</div>

 <input id="imp" type="file" accept=".json,application/json" hidden onchange="importSave(this)"></div>`}
function importBox(){return`<div class="card" style="margin-top:14px"><div class="res">Have a save file from another device?</div><div class="seg" style="margin-top:8px"><button onclick="document.getElementById('imp').click()">Import save file</button></div><input id="imp" type="file" accept=".json,application/json" hidden onchange="importSave(this)"></div>`}
function exportSave(){save();const b=new Blob([JSON.stringify(S)],{type:"application/json"}),a=document.createElement("a");
 a.href=URL.createObjectURL(b);a.download=`touchline-${S.teams[S.user].ini}-season${S.season}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function importSave(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();
 r.onload=()=>{try{const x=JSON.parse(r.result);if((x.v===2&&migrate(x),x.v!==3)||!Array.isArray(x.teams)||x.teams.length!==24||!x.fx||!x.table||!x.cup||!x.club)throw 0;S=x;fixNid();tab="home";live=null;tview=null;save();render()}
  catch(e){alert("That file is not a valid save for this version of Touchline Manager.")}};r.readAsText(f);inp.value=""}

 tb.style.display="flex";const t=S.teams[S.user];
